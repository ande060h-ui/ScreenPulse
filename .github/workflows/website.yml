name: Website

on:
  push:
    paths: ["website/**", "benchmark/**", "tests/**", "package.json", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "benchmark/**", "tests/**", "package.json", ".github/workflows/website.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Check Node scripts
        run: npm run lint
      - name: Build website
        working-directory: website
        run: |
          npm ci
          npm run build
